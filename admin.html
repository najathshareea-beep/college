<script>
// Your original SCRIPT_URL
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtu1wQnYzpdb93B_N3MVbJrl28c26lfHsW5xCrWh6UgwlxePnkFOmwqOyoUjRF_GNmvg/exec';

// ==================== AUTO SHOW LOGIN MODAL ON PAGE LOAD ====================
document.addEventListener('DOMContentLoaded', function() {
  // Show login modal automatically when page loads
  const adminLoginModal = new bootstrap.Modal(document.getElementById('adminLoginModal'));
  adminLoginModal.show();
});

// ==================== ADMIN LOGIN LOGIC ====================
document.getElementById('adminLoginForm')?.addEventListener('submit', function(e) {
  e.preventDefault();
  const username = document.getElementById('adminUsername').value.trim();
  const password = document.getElementById('adminPassword').value.trim();

  if (username === 'admin' && password === '786') {
    bootstrap.Modal.getOrCreateInstance(document.getElementById('adminLoginModal')).hide();
    document.getElementById('adminPanelSection').style.display = 'block';
    document.getElementById('adminDataDisplay').innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    alert('Wrong username or password');
  }
});

function logoutAdmin() {
  document.getElementById('adminPanelSection').style.display = 'none';
  document.getElementById('adminDataDisplay').innerHTML = '';
  // Show login modal again
  const adminLoginModal = new bootstrap.Modal(document.getElementById('adminLoginModal'));
  adminLoginModal.show();
}

// ────────────────────────────────────────────────────────────────
//  DOWNLOAD ALL APPLICATIONS – now with your exact headers
// ────────────────────────────────────────────────────────────────
async function generateAllApplicationsPDF() {
  const displayArea = document.getElementById('adminDataDisplay');
  displayArea.innerHTML = '<div class="text-center my-5"><div class="spinner-border text-success"></div><p class="mt-3">Preparing all application forms... Please wait</p></div>';

  try {
    const resp = await fetch(`${SCRIPT_URL}?type=all_applications`);
    const result = await resp.json();

    if (result.status !== 'success' || !result.data?.length) {
      displayArea.innerHTML = '<div class="alert alert-warning">No applications found in sheet.</div>';
      return;
    }

    // Debug: show real headers once
    console.log("Real sheet headers:", Object.keys(result.data[0]));

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({format: 'a4', unit: 'mm'});

    for (let i = 0; i < result.data.length; i++) {
      const row = result.data[i];

      // Safe value getter: try exact header first, then fallback
      const get = (header) => row[header] ?? row[header.trim()] ?? '';

      const studentData = {
        submissionDate: formatDate(get('Timestamp')) || new Date().toLocaleDateString('en-GB'),
        applicationId: get('ID') || get('Reg. No') || 'N/A',
        studentName: get('Name') || 'N/A',
        houseName: get('House') || 'N/A',
        dob: get('DOB') || 'N/A',
        aadhaarNumber: get('Aadhar') || 'N/A',

function formatDate(dateInput) {
  if (!dateInput) return new Date().toLocaleDateString();
  const date = new Date(dateInput);
  return date.toLocaleDateString('en-GB'); // DD-MM-YYYY
}

function formatDate(ts) {
  if (!ts) return new Date().toLocaleDateString('en-GB');
  const d = new Date(ts);
  return `${d.getDate().toString().padStart(2,'0')}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getFullYear()}`;
}

function getLocalYMD(dateInput) {
  if (!dateInput) return '';
  const date = new Date(dateInput);
  return date.toISOString().split('T')[0]; // YYYY-MM-DD
}

function readFileAsBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function escapeHtml(text){
  if(!text)return'';
  const map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'};
  return String(text).replace(/[&<>"']/g,function(m){return map[m];});
}
