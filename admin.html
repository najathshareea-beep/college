// ==================== ADMIN LOGIN LOGIC ====================

  e.preventDefault();
  const username = document.getElementById('adminUsername').value.trim();
  const password = document.getElementById('adminPassword').value.trim();

  if (username === 'admin' && password === '786') {
    bootstrap.Modal.getOrCreateInstance(document.getElementById('adminLoginModal')).hide();

    document.getElementById('adminPanelSection').style.display = 'block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {

});

  document.getElementById('mainContentArea').style.display = 'block';
  document.getElementById('adminDataDisplay').innerHTML = '';
}

// ==================== BULK DOWNLOAD (PDF) ====================
async function bulkDownload(type) {
  let queryType = '';
  if (type === 'applications') queryType = 'all_applications';
  else if (type === 'halltickets') queryType = 'all_halltickets';
  else if (type === 'results')    queryType = 'all_results';
  else return;

  try {
    const resp = await fetch(`${SCRIPT_URL}?type=${queryType}`);
    const result = await resp.json();

    if (result.status !== 'success' || !result.data?.length) {
      alert('No records found or error occurred.');
      return;
    }

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape' });

    doc.setFontSize(18);
    doc.text(`All ${type.charAt(0).toUpperCase() + type.slice(1)} - ${new Date().toLocaleDateString()}`, 14, 20);

    // Use first row to get headers
    const headers = Object.keys(result.data[0]);
    const rows = result.data.map(obj => headers.map(key => obj[key] ?? ''));

    doc.autoTable({
      head: [headers],
      body: rows,
      startY: 30,
      theme: 'grid',
      styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
      headStyles: { fillColor: [10, 92, 54], textColor: [255,255,255] },
      alternateRowStyles: { fillColor: [248, 243, 230] }
    });

    doc.save(`All_${type}_${new Date().toISOString().slice(0,10)}.pdf`);
  } catch (err) {
    console.error(err);
    alert('Error while fetching or generating PDF');
  }
}

// ==================== SHOW APPLICATION DATA TABLE ====================
async function showApplicationData() {
  const displayArea = document.getElementById('adminDataDisplay');
  displayArea.innerHTML = '<div class="text-center my-5"><div class="spinner-border text-success" role="status"></div><p class="mt-3">Loading data...</p></div>';

  try {
    const resp = await fetch(`${SCRIPT_URL}?type=all_applications`); // or use ?type=application_data
    const result = await resp.json();

    if (result.status !== 'success' || !result.data?.length) {
      displayArea.innerHTML = '<div class="alert alert-warning">No data found or error occurred.</div>';
      return;
    }

    let html = `
      <h3 class="text-center mb-4">All Application Data (Columns B to AA)</h3>
      <div class="table-responsive" id="adminDataTable">
        <table class="table table-bordered table-striped table-hover">
          <thead class="table-dark">
            <tr>`;

    // Headers from first row (adjust if your script returns fixed headers)
    const headers = Object.keys(result.data[0]);
    headers.forEach(h => {
      html += `<th>${h}</th>`;
    });

    html += `
            </tr>
          </thead>
          <tbody>`;

    result.data.forEach(row => {
      html += '<tr>';
      headers.forEach(key => {
        html += `<td>${row[key] ?? ''}</td>`;
      });
      html += '</tr>';
    });

    html += '</tbody></table></div>';

    displayArea.innerHTML = html;
  } catch (err) {
    displayArea.innerHTML = '<div class="alert alert-danger">Failed to load application data.</div>';
    console.error(err);
  }
}
