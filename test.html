<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANSAS Executive Committee</title>
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts for Islamic aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=El+Messiri:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --islamic-green: #0a5c36;
      --islamic-gold: #c19a53;
      --light-beige: #f8f3e9;
      --dark-blue: #1a365d;
      --accent-blue: #2d5aa0;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background-color: var(--light-beige);
      color: #333;
    }
    
    .arabic {
      font-family: 'Amiri', serif;
      direction: rtl;
    }
    
    .header-section {
      background: linear-gradient(135deg, var(--islamic-green) 0%, #0a3524 100%);
      color: white;
      padding: 80px 0 60px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .header-section::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z" fill="%23ffffff" fill-opacity="0.05" fill-rule="evenodd"/></svg>');
    }
    
    .islamic-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 60px 0;
      position: relative;
    }
    
    .islamic-divider .quranic-verse {
      background: linear-gradient(135deg, rgba(10, 92, 54, 0.1), rgba(193, 154, 83, 0.05));
      padding: 1.5rem 2.5rem;
      border-radius: 12px;
      border: 2px solid var(--islamic-gold);
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    
    .islamic-divider .arabic-text {
      font-size: 2rem;
      color: var(--islamic-green);
      direction: rtl;
      line-height: 1.8;
      margin-bottom: 1rem;
    }
    
    .islamic-divider .translation {
      font-size: 1.1rem;
      color: #666;
      font-style: italic;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(193, 154, 83, 0.3);
    }
    
    .bismillah-badge {
      font-family: 'Amiri', serif;
      font-size: 3rem;
      color: var(--islamic-gold);
      text-align: center;
      margin: 2rem 0;
      position: relative;
      padding: 1rem;
    }
    
    .bismillah-badge::before,
    .bismillah-badge::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 100px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--islamic-gold), transparent);
    }
    
    .bismillah-badge::before {
      left: -120px;
    }
    
    .bismillah-badge::after {
      right: -120px;
    }
    
    @media (max-width: 768px) {
      .islamic-divider .arabic-text {
        font-size: 1.5rem;
      }
      
      .bismillah-badge {
        font-size: 2rem;
      }
      
      .bismillah-badge::before,
      .bismillah-badge::after {
        width: 50px;
      }
      
      .bismillah-badge::before {
        left: -60px;
      }
      
      .bismillah-badge::after {
        right: -60px;
      }
    }
  </style>
</head>

<body>
  <!-- Header Section -->
  <header class="header-section">
    <div class="container">
      <h1 class="display-4 fw-bold mb-4">ANSAS Executive Committee</h1>
      <p class="lead">Academic Network for Sharia and Arts Studies</p>
    </div>
  </header>

  <!-- Main Content Container -->
  <div class="container my-5">
    <!-- Bismillah Badge -->
    <div class="bismillah-badge">
      ﷽
    </div>
    
    <!-- Islamic Divider with Quranic Verse -->
    <div class="islamic-divider">
      <div class="quranic-verse">
        <div class="arabic-text">
          [ سورة غافر: 41] ﴾ ۞ وَيَا قَوْمِ مَا لِي أَدْعُوكُمْ إِلَى النَّجَاةِ ﴿
        </div>
        <div class="translation">
          "O my people! How is it that I call you to salvation while you call me to the Fire?" - Surah Ghafir: 41
        </div>
      </div>
    </div>
    
    <!-- Your existing content here -->
    <div class="content-section">
      <!-- Add your ANSAS Executive Committee content here -->
      <h2 class="text-center mb-4" style="color: var(--islamic-green);">Committee Members</h2>
      <!-- Your content continues... -->
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
