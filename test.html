<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form - CSV to Google Sheets</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .alert { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h2>Admission Registration Form</h2>
    <p>Data will be saved directly to Google Sheets via CSV</p>
    
    <form id="admissionForm">
        <div class="form-group">
            <label for="phone">Mobile Number *</label>
            <input type="text" id="phone" name="phone" required maxlength="10" minlength="10" 
                   placeholder="Enter 10-digit mobile number">
            <span id="phoneCount" style="color:#666; font-size:12px;"></span>
        </div>
        
        <div class="form-group">
            <label for="name">Full Name With Initial *</label>
            <input type="text" id="name" name="name" required placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
            <label for="category">Admission Category *</label>
            <select id="category" name="category" required>
                <option value="">-- Select --</option>
                <option value="SECONDARY">SECONDARY</option>
                <option value="HIGHER SECONDARY">HIGHER SECONDARY</option>
            </select>
        </div>
        
        <button type="submit" id="submitBtn">Submit Registration</button>
    </form>
    
    <div id="message"></div>
    
    <script>
        // Phone number character counter
        document.getElementById('phone').addEventListener('input', function(e) {
            document.getElementById('phoneCount').textContent = 
                `${e.target.value.length}/10 characters`;
        });
        
        // Form submission handler
        document.getElementById('admissionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            messageDiv.innerHTML = '<div class="alert loading">Submitting your data...</div>';
            messageDiv.style.display = 'block';
            
            // Get form data
            const formData = {
                timestamp: new Date().toISOString(),
                phone: document.getElementById('phone').value,
                name: document.getElementById('name').value,
                category: document.getElementById('category').value
            };
            
            try {
                // Method 1: Direct POST to FormSubmit (Recommended)
                await submitViaFormSubmit(formData);
                
                // OR Method 2: Use Google Forms (if you prefer)
                // await submitViaGoogleForms(formData);
                
                messageDiv.innerHTML = '<div class="alert success">✅ Registration successful! Data saved to Google Sheets.</div>';
                document.getElementById('admissionForm').reset();
                document.getElementById('phoneCount').textContent = '';
                
            } catch (error) {
                messageDiv.innerHTML = `<div class="alert error">❌ Error: ${error.message}</div>`;
                console.error('Submission error:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Registration';
            }
        });
        
        // Method 1: Using FormSubmit.co (Free & Simple)
        async function submitViaFormSubmit(data) {
            // First, sign up at https://formsubmit.co (free)
            // Get your form endpoint from FormSubmit
            
            const FORM_SUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_FORM_ID_HERE";
            
            const response = await fetch(FORM_SUBMIT_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    ...data,
                    _subject: "New Admission Registration",
                    _template: "table", // Formats data as table
                    _autoresponse: `Thank you for your registration, ${data.name}!`
                })
            });
            
            if (!response.ok) {
                throw new Error('Failed to submit form');
            }
            
            return response.json();
        }
        
        // Method 2: Direct CSV to Google Sheets (using Google Forms)
        async function submitViaGoogleForms(data) {
            // You need to create a Google Form first
            const GOOGLE_FORM_ID = "YOUR_GOOGLE_FORM_ID";
            const FORM_URL = `https://docs.google.com/forms/d/e/${GOOGLE_FORM_ID}/formResponse`;
            
            // Map your fields to Google Form entry IDs
            const params = new URLSearchParams({
                'entry.1234567890': data.phone,    // Replace with actual entry IDs
                'entry.0987654321': data.name,     // Replace with actual entry IDs
                'entry.1122334455': data.category  // Replace with actual entry IDs
            });
            
            // Note: This method may have CORS restrictions
            const response = await fetch(FORM_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params
            });
            
            // With no-cors, we can't check response
            return { success: true };
        }
    </script>
</body>
</html>
