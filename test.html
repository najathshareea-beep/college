<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANSAS Executive Committee</title>
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts for Islamic aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=El+Messiri:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --islamic-green: #0a5c36;
      --islamic-gold: #c19a53;
      --light-beige: #f8f3e9;
      --dark-blue: #1a365d;
      --accent-blue: #2d5aa0;
    }
    

    .islamic-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 40px 0;
    }
    
    .islamic-divider span {
      font-family: 'Amiri', serif;
      font-size: 1.8rem;
      color: var(--islamic-gold);
      margin: 0 15px;
    }
    
    .islamic-divider::before,
    .islamic-divider::after {
      content: "";
      flex: 1;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--islamic-gold), transparent);
    }

  </style>
</head>

<body>


  <!-- Islamic Divider -->
  <div class="container">
    <div class="islamic-divider">
      <span>﷽</span>
      <span>[ سورة غافر: 41] ﴾ ۞ وَيَا قَوْمِ مَا لِي أَدْعُوكُمْ إِلَى النَّجَاةِ ﴿</span>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
