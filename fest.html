    // Animated counter for statistics
    function startCounterAnimation() {
        const counters = document.querySelectorAll('.count-up');
        const speed = 200;
        
        counters.forEach(counter => {
            const target = parseInt(counter.getAttribute('data-target'));
            const increment = target / speed;
            let current = 0;
            
            const updateCounter = () => {
                current += increment;
                if (current < target) {
                    counter.textContent = Math.floor(current);
                    setTimeout(updateCounter, 1);
                } else {
                    counter.textContent = target;
                }
            };
            
            updateCounter();
        });
    }

    // Clean category names
    function cleanCategoryName(category) {
        if (!category) return '';
        
        category = category.replace('SENIOR - ', '')
                          .replace('Non stage', '')
                          .replace('Non Stage', '')
                          .trim();
        
        const categoryMap = {
            'general': 'General',
            'group': 'Group',
            'sub junior': 'Sub Junior',
            'junior': 'Junior',
            'senior': 'Senior'
        };
        
        const lowerCategory = category.toLowerCase();
        for (const key in categoryMap) {
            if (lowerCategory.includes(key)) {
                return categoryMap[key];
            }
        }
        
        return category;
    }
    
    // Calculate total scores
    function calculateTotalScores() {
        totalScores = { jaihoon: 0, saihoon: 0 };
        
        for (const category in scoreboardData) {
            if (category !== 'Total') {
                totalScores.jaihoon += scoreboardData[category].jaihoon || 0;
                totalScores.saihoon += scoreboardData[category].saihoon || 0;
            }
        }
        
        if (scoreboardData['Total']) {
            totalScores = {
                jaihoon: scoreboardData['Total'].jaihoon || 0,
                saihoon: scoreboardData['Total'].saihoon || 0
            };
        }
    }
    
    // Parse CSV data
    function parseCSV(csv) {
        const lines = csv.trim().split('\n');
        return lines.map(line => {
            const result = [];
            let inQuotes = false;
            let currentField = '';
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"' && line[i + 1] === '"') {
                    currentField += '"';
                    i++;
                } else if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(currentField);
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            
            result.push(currentField);
            return result.map(cell => cell.trim());
        });
    }

    // Update program statistics
    function updateProgramStats() {
        const totalPrograms = allEvents.length;
        const completedPrograms = allResults.length;
        const ongoingPrograms = Math.floor(totalPrograms * 0.3);
        const upcomingPrograms = Math.max(0, totalPrograms - completedPrograms - ongoingPrograms);
        
        document.getElementById('total-programs').textContent = totalPrograms;
        document.getElementById('completed-programs').textContent = completedPrograms;
        document.getElementById('ongoing-programs').textContent = ongoingPrograms;
        document.getElementById('upcoming-programs').textContent = upcomingPrograms;
    }

    // Display toppers
    function displayToppers(category) {
        const container = document.getElementById('toppers-container');
        
        container.innerHTML = '';
        
        if (allResults.length === 0) {
            container.innerHTML = `
                <div class="text-center py-16">
                    <div class="loader mx-auto mb-6"></div>
                    <p class="text-gray-600">Loading toppers data...</p>
                </div>
            `;
            return;
        }
        
        // Calculate top performers
        const candidatePoints = {};
        
        allResults.forEach(result => {
            // First place
            if (result.firstChestNo && result.firstName) {
                const key = `${result.firstChestNo}-${result.firstName}`;
                if (!candidatePoints[key]) {
                    candidatePoints[key] = {
                        chestNo: result.firstChestNo,
                        name: result.firstName,
                        team: result.firstGroup,
                        category: result.category,
                        totalPoints: 0,
                        totalGradePoints: 0,
                        events: []
                    };
                }
                candidatePoints[key].totalPoints += result.firstPoint || 0;
                candidatePoints[key].totalGradePoints += result.firstGradePoint || 0;
            }
            
            // Second place
            if (result.secondChestNo && result.secondName) {
                const key = `${result.secondChestNo}-${result.secondName}`;
                if (!candidatePoints[key]) {
                    candidatePoints[key] = {
                        chestNo: result.secondChestNo,
                        name: result.secondName,
                        team: result.secondGroup,
                        category: result.category,
                        totalPoints: 0,
                        totalGradePoints: 0,
                        events: []
                    };
                }
                candidatePoints[key].totalPoints += result.secondPoint || 0;
                candidatePoints[key].totalGradePoints += result.secondGradePoint || 0;
            }
            
            // Third place
            if (result.thirdChestNo && result.thirdName) {
                const key = `${result.thirdChestNo}-${result.thirdName}`;
                if (!candidatePoints[key]) {
                    candidatePoints[key] = {
                        chestNo: result.thirdChestNo,
                        name: result.thirdName,
                        team: result.thirdGroup,
                        category: result.category,
                        totalPoints: 0,
                        totalGradePoints: 0,
                        events: []
                    };
                }
                candidatePoints[key].totalPoints += result.thirdPoint || 0;
                candidatePoints[key].totalGradePoints += result.thirdGradePoint || 0;
            }
        });
        
        // Convert to array and sort
        const candidatesArray = Object.values(candidatePoints);
        
        // Group by category
        const toppersByCategory = {};
        candidatesArray.forEach(candidate => {
            if (!toppersByCategory[candidate.category]) {
                toppersByCategory[candidate.category] = [];
            }
            toppersByCategory[candidate.category].push(candidate);
        });
        
        // Sort each category
        for (const cat in toppersByCategory) {
            toppersByCategory[cat].sort((a, b) => b.totalPoints - a.totalPoints);
        }
        
        // Display based on selected category
        if (category === 'all') {
            const categoriesToShow = ['General', 'Sub Junior', 'Junior', 'Senior', 'Group'];
            
            categoriesToShow.forEach((cat, catIndex) => {
                if (toppersByCategory[cat] && toppersByCategory[cat].length > 0) {
                    const top3 = toppersByCategory[cat].slice(0, 3);
                    
                    const categorySection = document.createElement('div');
                    categorySection.className = `mb-16 animate-fade-in`;
                    categorySection.style.animationDelay = `${catIndex * 0.2}s`;
                    categorySection.innerHTML = `
                        <div class="flex items-center justify-center mb-10">
                            <div class="flex-1 h-px bg-gradient-to-r from-transparent via-gray-300 to-transparent"></div>
                            <h3 class="text-3xl font-bold mx-6 gradient-text">${cat} Toppers</h3>

                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            ${top3.map((candidate, index) => `
                                <div class="bg-white rounded-2xl shadow-lg p-8 text-center relative card-hover">
                                    <div class="absolute -top-4 left-1/2 transform -translate-x-1/2 w-12 h-12 rounded-2xl flex items-center justify-center text-white font-bold shadow-lg ${index < 3 ? `topper-rank-${index + 1}` : 'bg-gray-500'}">
                                        ${index + 1}

                                    <div class="text-center">
                                        <div class="text-5xl font-bold mb-4 text-gray-800">${candidate.totalPoints}</div>
                                        <div class="text-sm text-gray-500 mb-6">Total Points</div>
                                        <h4 class="text-xl font-bold mb-3 text-gray-800">${candidate.name}</h4>
                                        <div class="text-sm text-gray-600 mb-4">Chest No: ${candidate.chestNo}</div>
                                        <div class="${getTeamColorClass(candidate.team)} px-4 py-2 rounded-full text-sm font-medium inline-block mb-4">
                                            ${candidate.team}
                                        </div>
                                        ${candidate.totalGradePoints > 0 ? `
                                            <div class="text-sm text-gray-600">
                                                <i class="fas fa-star text-yellow-500 mr-2"></i>Grade Points: ${candidate.totalGradePoints}
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(categorySection);
                }
            });
        } else {
            // Show specific category
            if (toppersByCategory[category] && toppersByCategory[category].length > 0) {
                const top10 = toppersByCategory[category].slice(0, 10);
                
                const categorySection = document.createElement('div');

                container.appendChild(categorySection);
            } else {
                container.innerHTML = `

                            <div class="flex items-center gap-2">
                                <span class="inline-flex items-center px-3 py-1 bg-yellow-100 text-yellow-800 rounded-lg text-sm font-medium">
                                    ${result.firstPoint} pts
                                </span>
                                ${result.firstGradePoint > 0 ? `
                                    <span class="inline-flex items-center px-3 py-1 bg-green-100 text-green-800 rounded-lg text-sm font-medium">
                                        ${result.firstGradePoint} gp
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                ` : ''}
                
                ${result.secondName ? `
                    <div class="bg-gradient-to-br from-gray-50 to-gray-100 rounded-2xl p-6 border border-gray-200">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-gradient-to-br from-gray-400 to-gray-600 rounded-xl flex items-center justify-center mr-4 shadow">
                                    <span class="font-bold text-white text-xl">2</span>
                                </div>
                                <div>
                                    <div class="text-sm text-gray-600">Chest No</div>
                                    <div class="font-bold text-lg">${result.secondChestNo || '-'}</div>
                                </div>
                            </div>
                            ${secondGroupBadge}
                        </div>
                        <div class="text-xl font-bold mb-4">${result.secondName}</div>
                        <div class="flex items-center justify-between">
                            <div class="text-sm text-gray-600">2nd Place</div>
                            <div class="flex items-center gap-2">
                                <span class="inline-flex items-center px-3 py-1 bg-gray-100 text-gray-800 rounded-lg text-sm font-medium">
                                    ${result.secondPoint} pts
                                </span>
                                ${result.secondGradePoint > 0 ? `
                                    <span class="inline-flex items-center px-3 py-1 bg-green-100 text-green-800 rounded-lg text-sm font-medium">
                                        ${result.secondGradePoint} gp
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                ` : ''}
                
                ${result.thirdName ? `
                    <div class="bg-gradient-to-br from-orange-50 to-amber-50 rounded-2xl p-6 border border-orange-100">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center">
                                <div class="w-12 h-12 bg-gradient-to-br from-orange-500 to-amber-600 rounded-xl flex items-center justify-center mr-4 shadow">
                                    <span class="font-bold text-white text-xl">3</span>
                                </div>
                                <div>
                                    <div class="text-sm text-gray-600">Chest No</div>
                                    <div class="font-bold text-lg">${result.thirdChestNo || '-'}</div>
                                </div>
                            </div>
                            ${thirdGroupBadge}
                        </div>
                        <div class="text-xl font-bold mb-4">${result.thirdName}</div>
                        <div class="flex items-center justify-between">
                            <div class="text-sm text-gray-600">3rd Place</div>
                            <div class="flex items-center gap-2">
                                <span class="inline-flex items-center px-3 py-1 bg-orange-100 text-orange-800 rounded-lg text-sm font-medium">
                                    ${result.thirdPoint} pts
                                </span>
                                ${result.thirdGradePoint > 0 ? `
                                    <span class="inline-flex items-center px-3 py-1 bg-green-100 text-green-800 rounded-lg text-sm font-medium">
                                        ${result.thirdGradePoint} gp
                                    </span>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                ` : ''}
            </div>
            
            ${!result.firstName && !result.secondName && !result.thirdName ? `
                <div class="text-center py-12">
                    <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i class="fas fa-info-circle text-gray-400 text-3xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold mb-4 text-gray-800">Results Not Published</h3>
                    <p class="text-gray-600">Results for this program have not been published yet. Please check back later.</p>
                </div>
            ` : ''}
        `;
        
        document.getElementById('modal-program-title').textContent = `${eventName} Results`;
        document.getElementById('modal-program-subtitle').textContent = `${result.category} Category`;
        openModal();
    }
    
    // Update toppers category
    function updateToppersCategory(category) {
        currentTopperCategory = category;
        displayToppers(category);
    }
    
    // Update program filter
    function updateProgramFilter(filter) {
        currentProgramFilter = filter;
        
        // Update button styles
        document.querySelectorAll('.program-filter-btn').forEach(btn => {
            if (btn.getAttribute('data-program-filter') === filter) {
                btn.classList.add('bg-gradient-to-r', 'from-green-500', 'to-emerald-600', 'text-white', 'shadow-lg');
                btn.classList.remove('bg-white', 'text-gray-700', 'shadow');
            } else {
                btn.classList.remove('bg-gradient-to-r', 'from-green-500', 'to-emerald-600', 'text-white', 'shadow-lg');
                btn.classList.add('bg-white', 'text-gray-700', 'shadow');
            }
        });
        
        displayPrograms();
    }
    
    // Get team badge HTML
    function getTeamBadge(teamName) {
        if (!teamName) return '<div class="text-sm bg-gray-100 text-gray-600 px-3 py-1 rounded-lg">-</div>';
        
        if (teamName.includes('Jaihoon')) {
            return '<div class="team-badge-jaihoon text-sm px-3 py-1 rounded-lg font-medium">Team Jaihoon</div>';
        } else if (teamName.includes('Saihoon')) {
            return '<div class="team-badge-saihoon text-sm px-3 py-1 rounded-lg font-medium">Team Saihoon</div>';
        } else {
            return `<div class="text-sm bg-gray-100 text-gray-600 px-3 py-1 rounded-lg">${teamName}</div>`;
        }
    }
    
    // Get team color class
    function getTeamColorClass(teamName) {
        if (teamName.includes('Jaihoon')) {
            return 'bg-gradient-to-r from-green-100 to-emerald-100 text-green-800 border border-green-200';
        } else if (teamName.includes('Saihoon')) {
            return 'bg-gradient-to-r from-blue-100 to-indigo-100 text-blue-800 border border-blue-200';
        } else {
            return 'bg-gray-100 text-gray-800 border border-gray-200';
        }
    }
    
    // Search chest number
    function searchChestNumber() {
        const chestNumber = document.getElementById('chest-number-input').value.trim().toUpperCase();
        const resultDiv = document.getElementById('chest-result');
        
        if (!chestNumber) {
            resultDiv.innerHTML = `
                <div class="bg-gradient-to-r from-red-50 to-pink-50 text-red-700 p-6 rounded-2xl border border-red-100">
                    <div class="flex items-center">
                        <i class="fas fa-exclamation-triangle text-red-500 mr-3 text-xl"></i>
                        <div>
                            <h4 class="font-bold">Please enter a chest number</h4>
                            <p class="text-red-600 text-sm mt-1">Enter your chest number to see your results</p>
                        </div>
                    </div>
                </div>
            `;
            resultDiv.classList.remove('hidden');
            return;
        }
        
        // Find candidate
        const candidate = allCandidates.find(c => c.chestNo === chestNumber);
        
        if (!candidate) {
            resultDiv.innerHTML = `
                <div class="bg-gradient-to-r from-yellow-50 to-amber-50 text-yellow-700 p-6 rounded-2xl border border-yellow-100">
                    <div class="flex items-center">
                        <i class="fas fa-search text-yellow-500 mr-3 text-xl"></i>
                        <div>
                            <h4 class="font-bold">Candidate Not Found</h4>
                            <p class="text-yellow-600 text-sm mt-1">No candidate found with chest number: <strong>${chestNumber}</strong></p>
                        </div>
                    </div>
                </div>
            `;
            resultDiv.classList.remove('hidden');
            return;
        }
        
        // Search results
        let foundResults = [];
        let totalPoints = 0;
        let totalGradePoints = 0;
        
        allResults.forEach(result => {
            if (result.firstChestNo === chestNumber) {
                foundResults.push({
                    position: '1st Place',
                    event: result.event,
                    points: result.firstPoint,
                    gradePoints: result.firstGradePoint
                });
                totalPoints += result.firstPoint;
                totalGradePoints += result.firstGradePoint;
            }
            if (result.secondChestNo === chestNumber) {
                foundResults.push({
                    position: '2nd Place',
                    event: result.event,
                    points: result.secondPoint,
                    gradePoints: result.secondGradePoint
                });
                totalPoints += result.secondPoint;
                totalGradePoints += result.secondGradePoint;
            }
            if (result.thirdChestNo === chestNumber) {
                foundResults.push({
                    position: '3rd Place',
                    event: result.event,
                    points: result.thirdPoint,
                    gradePoints: result.thirdGradePoint
                });
                totalPoints += result.thirdPoint;
                totalGradePoints += result.thirdGradePoint;
            }
        });
        
        // Display results
        let html = `<div class="bg-gradient-to-r from-green-50 to-emerald-50 p-8 rounded-2xl border border-green-100">`;
        html += `<h4 class="text-xl font-bold mb-6 text-gray-800">Results for: <span class="text-green-700">${candidate.name}</span></h4>`;
        html += `<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">`;
        html += `<div class="bg-white p-4 rounded-xl shadow-sm"><div class="text-sm text-gray-500">Chest No</div><div class="text-lg font-bold">${candidate.chestNo}</div></div>`;
        html += `<div class="bg-white p-4 rounded-xl shadow-sm"><div class="text-sm text-gray-500">Team</div><div class="text-lg font-bold ${getTeamColorClass(candidate.team)} px-4 py-2 rounded-lg">${candidate.team}</div></div>`;
        html += `<div class="bg-white p-4 rounded-xl shadow-sm"><div class="text-sm text-gray-500">Category</div><div class="text-lg font-bold">${candidate.category}</div></div>`;
        html += `</div>`;
        
        if (foundResults.length > 0) {
            html += `<div class="mb-8"><h5 class="font-bold mb-4 text-gray-800">Event Results:</h5>`;
            
            foundResults.forEach(result => {
                let positionColor = 'text-gray-600';
                let positionBg = 'bg-gray-100';
                
                if (result.position === '1st Place') {
                    positionColor = 'text-yellow-600';
                    positionBg = 'bg-yellow-100';
                } else if (result.position === '2nd Place') {
                    positionColor = 'text-gray-600';
                    positionBg = 'bg-gray-100';
                } else if (result.position === '3rd Place') {
                    positionColor = 'text-orange-600';
                    positionBg = 'bg-orange-100';
                }
                
                html += `
                    <div class="flex items-center justify-between p-4 bg-white rounded-xl shadow-sm mb-3 hover:shadow-md transition-all duration-300">
                        <div class="flex items-center">
                            <span class="${positionColor} ${positionBg} px-3 py-1 rounded-lg text-sm font-medium mr-4">${result.position}</span>
                            <span class="font-medium text-gray-800">${result.event}</span>
                        </div>
                        <div class="flex items-center">
                            <span class="font-bold text-green-600 mr-3">${result.points} pts</span>
                            ${result.gradePoints > 0 ? `<span class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-lg">${result.gradePoints} gp</span>` : ''}
                        </div>
                    </div>
                `;
            });
            
            html += `</div>`;
            
            html += `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="p-6 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-2xl shadow-lg">
                        <div class="text-sm opacity-90">Total Points</div>
                        <div class="text-4xl font-bold">${totalPoints}</div>
                    </div>
                    ${totalGradePoints > 0 ? `
                        <div class="p-6 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-2xl shadow-lg">
                            <div class="text-sm opacity-90">Total Grade Points</div>
                            <div class="text-4xl font-bold">${totalGradePoints}</div>
                        </div>
                    ` : ''}
                </div>
            `;
        } else {
            html += `
                <div class="bg-gradient-to-r from-yellow-50 to-amber-50 text-yellow-700 p-6 rounded-2xl border border-yellow-100">
                    <div class="flex items-center">
                        <i class="fas fa-clock text-yellow-500 mr-3 text-xl"></i>
                        <div>
                            <h4 class="font-bold">No Results Yet</h4>
                            <p class="text-yellow-600 text-sm mt-1">No event results found yet. Check back later for updates.</p>
                        </div>
                    </div>
                </div>
            `;
        }
        
        html += `</div>`;
        
        resultDiv.innerHTML = html;
        resultDiv.classList.remove('hidden');
    }
</script>
